<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diário de Leitura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <main class="container app">

    <header class="topo">
      <h1 class="titulo-app"><i class="fa-regular fa-book" aria-hidden="true"></i> Diário de Leitura</h1>
      <button type="button" class="btn btn-primary btn-registrar" id="btn-registrar">
        <i class="fa-solid fa-plus" aria-hidden="true"></i> <span>Registrar livro</span>
      </button>
    </header>

    <section class="indicadores" aria-label="Resumo das leituras">
      <div class="indicador"><span class="indicador-rotulo" id="rotulo-ano">Lidos em ----</span><strong id="ind-lidos-ano">0</strong></div>
      <div class="indicador"><span class="indicador-rotulo">Total lidos</span><strong id="ind-total">0</strong></div>
      <div class="indicador"><span class="indicador-rotulo">Páginas lidas</span><strong id="ind-paginas">0</strong></div>
      <div class="indicador"><span class="indicador-rotulo">Nota média</span><strong id="ind-nota">–</strong></div>
      <div class="indicador"><span class="indicador-rotulo">Lendo agora</span><strong id="ind-lendo">0</strong></div>
    </section>

    <section class="cartao-form" id="secao-form" hidden>
      <h2 class="titulo-secao" id="titulo-form">Registrar livro</h2>
      <form id="form-livro" novalidate>
        <input type="hidden" id="livro-id">

        <div class="mb-3">
          <label class="form-label" for="titulo">Nome do livro</label>
          <input type="text" class="form-control" id="titulo" maxlength="200" autocomplete="off" required>
          <div class="invalid-feedback"></div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="autor">Autor</label>
            <input type="text" class="form-control" id="autor" maxlength="150" autocomplete="off" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="editora">Editora <span class="opcional">(opcional)</span></label>
            <input type="text" class="form-control" id="editora" maxlength="150" autocomplete="off">
            <div class="invalid-feedback"></div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="paginas">Quantidade de páginas <span class="opcional">(opcional)</span></label>
            <input type="number" class="form-control" id="paginas" min="1" step="1" inputmode="numeric">
            <div class="invalid-feedback"></div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="inicio">Início da leitura</label>
            <input type="date" class="form-control" id="inicio" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="termino">Término da leitura <span class="opcional">(opcional)</span></label>
            <input type="date" class="form-control" id="termino">
            <div class="invalid-feedback"></div>
          </div>
        </div>

        <div class="mb-3">
          <span class="form-label d-block" id="rotulo-avaliacao">Avaliação <span class="opcional">(opcional)</span></span>
          <div class="estrelas-entrada" id="estrelas" role="group" aria-labelledby="rotulo-avaliacao"></div>
          <div class="text-danger small mt-1" id="erro-avaliacao" hidden></div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="comentarios">Comentários <span class="opcional">(opcional)</span></label>
          <textarea class="form-control" id="comentarios" rows="4" maxlength="2000"
            placeholder="O que você achou do livro, trechos marcantes, para quem recomendaria..."></textarea>
          <div class="invalid-feedback"></div>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
          <button type="button" class="btn btn-outline-secondary" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar">
            <i class="fa-solid fa-check" aria-hidden="true"></i> Salvar
          </button>
        </div>
      </form>
    </section>

    <section class="lista" id="lista" aria-label="Livros registrados"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
